<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Altovolta — Post</title>
<link rel="stylesheet" href="social.css" />
<style>
  body { width: 1080px; height: 1080px; }
  .brand { font-size: 92px; }
  .tagline { margin-top: 18px; font-size: 24px; max-width: 760px; }
  .season { margin-bottom: 14px; }
  .content { margin-top: -20px; }
  .chips { bottom: 30px; left: 0; right: 0; justify-content: center; }
  .chip { font-size: 21px; padding: 12px 24px; }
  .wa-dot { width: 11px; height: 11px; }
  .foot { bottom: 12px; font-size: 15px; }

  .scene { position: relative; width: 1080px; height: 800px; margin-top: 22px; }

  .laptop { left: 96px; top: 70px; }
  .laptop-wrap { transform: scale(0.88); }
  .laptop-screen { width: 1020px; height: 636px; }
  .laptop-base { width: 1160px; }
  .laptop-shadow { width: 940px; }

  .phone { right: 70px; top: 230px; }
  .phone-wrap { transform: scale(0.84); }
  .phone-frame { width: 396px; height: 800px; }
</style>
</head>
<body>
  <div class="vignette"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-floor"></div>

  <div class="content">
    <div class="season">Nueva temporada 2026</div>
    <h1 class="brand">alt0<span class="red">volta</span></h1>
    <p class="tagline">Ropa con actitud. Elegí tus prendas y pedí directo por WhatsApp.</p>
  </div>

  <div class="scene">
    <div class="laptop"><div class="laptop-wrap">
      <div class="laptop-screen">
        <div class="laptop-inner">
          <div class="browser-chrome">
            <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
            <span class="url-pill"><span class="lock">🔒</span>altovolta.vercel.app</span>
          </div>
          <div class="browser-body">
            <img class="screen-img" src="laptop-home.png" alt="altovolta.vercel.app" />
          </div>
        </div>
      </div>
      <div class="laptop-base"></div>
      <div class="laptop-shadow"></div>
    </div></div>

    <div class="phone"><div class="phone-wrap">
      <div class="phone-frame">
        <div class="phone-inner">
          <div class="phone-island"></div>
          <div class="phone-browser">
            <span class="phone-url"><span class="lock">🔒</span>altovolta.vercel.app</span>
          </div>
          <div class="phone-body">
            <img class="screen-img" src="phone-home.png" alt="altovolta.vercel.app" />
          </div>
        </div>
      </div>
    </div></div>
  </div>

  <div class="chips">
    <span class="chip chip-wa"><span class="wa-dot"></span>Pedidos por WhatsApp</span>
    <span class="chip chip-url">altovolta.vercel.app</span>
  </div>

  <div class="foot">Altovolta · Ropa con actitud</div>
</body>
</html>
