<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Altovolta — Story</title>
<link rel="stylesheet" href="white.css" />
<style>
  body { width: 1080px; height: 1920px; }

  .logo { left: 70px; top: 90px; }
  .logo .brand { font-size: 62px; }
  .season-pill { right: 70px; top: 100px; }

  .laptop { left: 0px; top: 560px; }
  .laptop-shadow { top: 790px; left: 60px; }

  .phone { left: 505px; top: 336px; }
  .phone-wrap { transform: perspective(1300px) rotateX(-14deg) rotateY(12deg); }
  .phone-frame { width: 396px; height: 800px; }
  .phone-shadow { left: 500px; top: 690px; }

  .foot { bottom: 80px; font-size: 16px; }
</style>
</head>
<body>
  <div class="bg-dots"></div>
  <div class="bg-tint-1"></div>
  <div class="bg-tint-2"></div>

  <div class="logo">
    <p class="brand">alt0<span class="red">volta</span></p>
    <p class="sub">Ropa con actitud</p>
  </div>
  <div class="season-pill">Nueva temporada 2026</div>

  <div class="laptop">
    <div class="laptop-scene">
      <div class="screen">
        <div class="screen-inner">
          <div class="browser-chrome">
            <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
            <span class="url-pill"><span class="lock">🔒</span>altovolta</span>
          </div>
          <div class="browser-body">
            <img class="screen-img" src="laptop-home.png" alt="Altovolta" />
          </div>
        </div>
      </div>
      <div class="deck">
        <div class="hinge"></div>
        <div class="keys">
          <span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span>
          <span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span>
          <span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span>
          <span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span><span class="key"></span>
        </div>
        <div class="trackpad"></div>
      </div>
    </div>
    <div class="shadow laptop-shadow"></div>
  </div>

  <div class="phone">
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="phone-inner">
          <div class="phone-island"></div>
          <div class="phone-browser">
            <span class="phone-url"><span class="lock">🔒</span>altovolta</span>
          </div>
          <div class="phone-body">
            <img class="screen-img" src="phone-home.png" alt="Altovolta" />
          </div>
        </div>
      </div>
    </div>
    <div class="shadow phone-shadow"></div>
  </div>

  <div class="foot">Altovolta · Ropa con actitud</div>
</body>
</html>
